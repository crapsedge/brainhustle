<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Performance Trackers | BrainHustle™</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00e676;
      --bg: #050505;
      --card: #0f0f0f;
      --border: #1e1e1e;
      --text-dim: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; display: flex; min-height: 100vh; }

    /* NAVIGATION */
    .sidebar { width: 260px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; }
    .brand-box { padding: 30px 25px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--border); }
    .brand-box span { color: var(--primary); }
    .nav-group { padding: 20px 0; flex-grow: 1; }
    .nav-group a { display: block; padding: 12px 25px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
    .nav-group a:hover { color: #fff; background: #0f0f0f; }

    /* CONTENT AREA */
    main { flex-grow: 1; margin-left: 260px; padding: 40px 60px; max-width: 900px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 40px; letter-spacing: -1px; }

    /* TRACKER CARDS */
    .tracker-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-bottom: 25px; }
    .tracker-card h3 { font-size: 18px; color: var(--primary); margin-bottom: 10px; font-weight: 800; }
    .tracker-card p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
    
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #000; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .data-item { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .data-item span { display: block; color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px; }

    .btn-action { display: block; width: 100%; padding: 12px; background: #222; color: #fff; border: none; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s; text-align: center; text-decoration: none; }
    .btn-action:hover { background: var(--primary); color: #000; }

    .upgrade-lock { background: rgba(255, 62, 62, 0.05); border: 1px solid #ff3e3e; padding: 40px; border-radius: 12px; text-align: center; margin-top: 30px; }

    @media (max-width: 900px) { .sidebar { display: none; } main { margin-left: 0; padding: 40px 20px; } }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="brand-box">Brain<span>Hustle</span>™</div>
    <div class="nav-group">
      <a href="dashboard.html">Dashboard</a>
      <a href="kits.html">Hustle Kits</a>
      <a href="ideas.html">Money Ideas</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="trackers.html" style="color:#fff; background:#0f0f0f;">Trackers</a>
    </div>
    <div style="padding: 20px; border-top: 1px solid var(--border);">
      <a href="#" onclick="logout()" style="color: #ff4444; font-size: 11px; font-weight:700; text-decoration:none;">LOGOUT</a>
    </div>
  </nav>

  <main>
    <h1>Performance Terminal</h1>
    <div id="contentArea">Syncing Secure Data...</div>
    
    <footer style="margin-top: 60px; padding: 30px 0; border-top: 1px solid var(--border); font-size: 11px; color: #444; text-align: center;">
      © 2026 MURRAYS EMPIRE LLC. Educational audit tools only.
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.appspot.com",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.logout = () => signOut(auth).then(() => window.location.href="login.html");

    const contentArea = document.getElementById('contentArea');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      
      const snap = await getDoc(doc(db, "users", user.uid));
      const level = snap.exists() ? (snap.data().membership || "starter") : "starter";

      if (level === "upgraded") {
        contentArea.innerHTML = `
          <div class="tracker-card">
            <h3>1. Bankroll & Capital Ledger</h3>
            <p>Master sheet to manage your empire's liquid assets and deployment strategy.</p>
            <div class="data-grid">
              <div class="data-item">Format<span>Excel / Sheets</span></div>
              <div class="data-item">Utility<span>Capital Audit</span></div>
            </div>
            <a href="#" class="btn-action">Download Master Ledger</a>
          </div>

          <div class="tracker-card">
            <h3>2. Master Cash Flow System</h3>
            <p>Monitor revenue streams, manage subscriptions, and set automated savings targets.</p>
            <div class="data-grid">
              <div class="data-item">Focus<span>Monthly P&L</span></div>
              <div class="data-item">Status<span>Ready</span></div>
            </div>
            <a href="#" class="btn-action">Deploy Income System</a>
          </div>

          <div class="tracker-card">
            <h3>3. Growth KPI Progress Monitor</h3>
            <p>Visualize your month-over-month growth with automated charting and projections.</p>
            <div class="data-grid">
              <div class="data-item">Update Frequency<span>Daily</span></div>
              <div class="data-item">Type<span>Growth Metric</span></div>
            </div>
            <a href="#" class="btn-action">Open KPI Monitor</a>
          </div>
        `;
      } else {
        contentArea.innerHTML = `
          <div class="tracker-card">
            <h3>Basic Progress Log</h3>
            <p>Starter template for logging your initial business milestones.</p>
            <a href="#" class="btn-action">Access Starter Log</a>
          </div>
          <div class="upgrade-lock">
            <h3 style="color:#ff3e3e; font-size:14px; margin-bottom:10px;">FOUNDER TIER REQUIRED</h3>
            <p style="font-size:12px; color:#888;">Unlock full professional audit systems and bankroll ledgers.</p>
            <a href="upgrade.html" style="color:#fff; font-weight:800; text-decoration:none; display:inline-block; margin-top:15px; border-bottom:1px solid #ff3e3e;">Upgrade Now</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
