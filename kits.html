<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hustle Kits | BrainHustle™</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00e676;
      --bg: #050505;
      --card: #0f0f0f;
      --border: #1e1e1e;
      --text-dim: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; display: flex; min-height: 100vh; }

    /* NAVIGATION */
    .sidebar { width: 260px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; }
    .brand-box { padding: 30px 25px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--border); }
    .brand-box span { color: var(--primary); }
    .nav-group { padding: 20px 0; flex-grow: 1; }
    .nav-group a { display: block; padding: 12px 25px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
    .nav-group a:hover { color: #fff; background: #0f0f0f; }

    /* CONTENT AREA */
    main { flex-grow: 1; margin-left: 260px; padding: 40px 60px; max-width: 900px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 40px; letter-spacing: -1px; }

    /* KIT CARDS */
    .kit-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-bottom: 25px; }
    .kit-card h3 { font-size: 18px; color: var(--primary); margin-bottom: 10px; font-weight: 800; }
    .kit-card p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
    
    .kit-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #000; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .meta-item { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .meta-item span { display: block; color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px; }

    .btn-action { display: block; width: 100%; padding: 12px; background: #222; color: #fff; border: none; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
    .btn-action:hover { background: var(--primary); color: #000; }

    /* MODAL TERMINAL */
    #kitModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; overflow-y: auto; }
    .terminal-box { max-width: 600px; margin: 40px auto; background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 40px; }
    .terminal-box h2 { color: var(--primary); margin-bottom: 15px; }
    .terminal-box p { line-height: 1.6; color: #ccc; margin-bottom: 15px; font-size: 14px; }

    @media (max-width: 900px) { .sidebar { display: none; } main { margin-left: 0; padding: 40px 20px; } }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="brand-box">Brain<span>Hustle</span>™</div>
    <div class="nav-group">
      <a href="dashboard.html">Dashboard</a>
      <a href="kits.html" style="color:#fff; background:#0f0f0f;">Hustle Kits</a>
      <a href="ideas.html">Money Ideas</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <main>
    <h1>Deployment Kits</h1>
    <div id="kitArea">Loading Secure Assets...</div>
  </main>

  <div id="kitModal">
    <div class="terminal-box">
      <div id="terminalContent"></div>
      <button onclick="closeKit()" style="margin-top:30px; background:none; border:1px solid #444; color:#888; padding:10px; cursor:pointer; width:100%;">[ CLOSE ASSET ]</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.appspot.com",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.logout = () => signOut(auth).then(() => window.location.href="login.html");
    window.closeKit = () => document.getElementById('kitModal').style.display = 'none';

    const ASSETS = {
      k1: `<h2>Digital Product Kit</h2><p><strong>Deployment:</strong> Use the Canva AI tool to build your 10-page guide. Export as PDF. Upload to Gumroad. Connect to your BrainHustle™ dashboard.</p>`,
      k2: `<h2>Business Tracker</h2><p><strong>Deployment:</strong> Access the Master Ledger. Log your daily ad spend, clicks, and revenue. Track your ROI with 100% precision.</p>`,
      k3: `<h2>Email Architecture</h2><p><strong>Deployment:</strong> 3-Day Sequence. Day 1: The Hook. Day 2: The Proof. Day 3: The Scarcity. Plug these into your automation tool.</p>`
    };

    window.openKit = (key) => {
      document.getElementById('terminalContent').innerHTML = ASSETS[key];
      document.getElementById('kitModal').style.display = 'block';
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById('kitArea').innerHTML = `
        <div class="kit-card">
          <h3>📥 Digital Product Template</h3>
          <p>Blueprints for eBooks, guides, and checklists. Ready for immediate deployment.</p>
          <div class="kit-meta">
            <div class="meta-item">TYPE<span>ASSET KIT</span></div>
            <div class="meta-item">FORMAT<span>PDF / DIGITAL</span></div>
          </div>
          <button class="btn-action" onclick="openKit('k1')">Deploy Resource</button>
        </div>

        <div class="kit-card">
          <h3>📥 Business Tracker System</h3>
          <p>The master ledger. Monitor revenue, track KPIs, and manage growth.</p>
          <div class="kit-meta">
            <div class="meta-item">TYPE<span>SYSTEM TOOL</span></div>
            <div class="meta-item">ACCESS<span>GOOGLE SHEETS</span></div>
          </div>
          <button class="btn-action" onclick="openKit('k2')">Open Tracker</button>
        </div>

        <div class="kit-card">
          <h3>📥 Email Funnel Architecture</h3>
          <p>High-conversion sequences designed to automate your revenue cycles.</p>
          <div class="kit-meta">
            <div class="meta-item">TYPE<span>FUNNEL PACK</span></div>
            <div class="meta-item">STATUS<span>CONVERSION READY</span></div>
          </div>
          <button class="btn-action" onclick="openKit('k3')">View Architecture</button>
        </div>
      `;
    });
  </script>
</body>
</html>
