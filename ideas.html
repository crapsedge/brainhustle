<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profit Vault | BrainHustle™</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00e676;
      --bg: #050505;
      --card: #0f0f0f;
      --border: #1e1e1e;
      --text-dim: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; display: flex; min-height: 100vh; }

    /* NAVIGATION */
    .sidebar { width: 260px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; }
    .brand-box { padding: 30px 25px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--border); }
    .brand-box span { color: var(--primary); }
    .nav-group { padding: 20px 0; flex-grow: 1; }
    .nav-group a { display: block; padding: 12px 25px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
    .nav-group a:hover { color: #fff; background: #0f0f0f; }

    /* CONTENT AREA */
    main { flex-grow: 1; margin-left: 260px; padding: 40px 60px; max-width: 900px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 40px; letter-spacing: -1px; }

    /* IDEA CARDS */
    .idea-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-bottom: 25px; }
    .idea-card h3 { font-size: 18px; color: var(--primary); margin-bottom: 10px; font-weight: 800; }
    .idea-card p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
    .formula-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #000; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .formula-item { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .formula-item span { display: block; color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px; }
    .btn-action { display: block; width: 100%; padding: 12px; background: #222; color: #fff; border: none; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
    .btn-action:hover { background: var(--primary); color: #000; }

    /* MODAL TERMINAL */
    #executionModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; overflow-y: auto; }
    .terminal-box { max-width: 600px; margin: 40px auto; background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 40px; }
    .terminal-box h2 { color: var(--primary); margin-bottom: 15px; }
    .terminal-box p { line-height: 1.6; color: #ccc; margin-bottom: 15px; }

    @media (max-width: 900px) { .sidebar { display: none; } main { margin-left: 0; padding: 40px 20px; } }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="brand-box">Brain<span>Hustle</span>™</div>
    <div class="nav-group">
      <a href="dashboard.html">Dashboard</a>
      <a href="kits.html">Hustle Kits</a>
      <a href="ideas.html" style="color:#fff; background:#0f0f0f;">Money Ideas</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <main>
    <h1>Profit Vault</h1>
    <div id="contentArea">Authenticating Secure Access...</div>
  </main>

  <div id="executionModal">
    <div class="terminal-box">
      <div id="terminalContent"></div>
      <button onclick="closeTerminal()" style="margin-top:30px; background:none; border:1px solid #444; color:#888; padding:10px; cursor:pointer; width:100%;">[ CLOSE TERMINAL ]</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.appspot.com",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.logout = () => signOut(auth).then(() => window.location.href="login.html");
    window.closeTerminal = () => document.getElementById('executionModal').style.display = 'none';

    const STRATEGIES = {
      s1: `<h2>Digital Service Arbitrage</h2><p>Find high-ticket tasks on freelance boards. Sell them to local business owners for a premium. Manage the project; let experts do the labor.</p>`,
      s2: `<h2>Anonymous Lead Routing</h2><p>Build simple landing pages for urgent services (Restoration, Towing). Send calls to local pros for a flat $100-$300 fee per job start.</p>`,
      s3: `<h2>AI Content Engines</h2><p>Use AI to generate 50 niche research articles. Monetize via high-payout affiliate networks (SaaS, Solar, Finance).</p>`,
      s4: `<h2>Micro-SaaS Connectors</h2><p>Create tools that link two softwares (e.g., Stripe to a custom dashboard). Charge monthly recurring fees for the connection.</p>`,
      s5: `<h2>Niche Newsletters</h2><p>Curation of industry news for professionals. Monetize through private sponsorships and high-CPM ad networks.</p>`,
      s6: `<h2>Domain Flipping (AI-Aided)</h2><p>Identify underpriced domain names using AI trend tools. Sell them to startups on Afternic or GoDaddy Auctions.</p>`,
      s7: `<h2>E-Book Vaults</h2><p>Package specific business solutions into digital PDFs. Sell globally on Gumroad or Amazon KDP with zero shipping costs.</p>`,
      s8: `<h2>Automated YouTube Faceless</h2><p>Use AI scripts and stock footage to build niche authority channels. Monetize via AdSense and affiliate links.</p>`,
      s9: `<h2>Subscription Template Packs</h2><p>Design business templates (Notion, Canva, Excel) once. Charge a monthly fee for updated access to new templates.</p>`,
      s10: `<h2>White-Label Software</h2><p>License existing software, rebrand it as your own, and sell it to specific local niches (e.g., CRM for Dentists).</p>`
    };

    window.openStrategy = (key) => {
      document.getElementById('terminalContent').innerHTML = STRATEGIES[key] || "Strategy data loading...";
      document.getElementById('executionModal').style.display = 'block';
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      const level = snap.exists() ? (snap.data().membership || "starter") : "starter";
      const content = document.getElementById('contentArea');
      
      if (level === "upgraded") {
        content.innerHTML = `
          ${renderCard(1, "s1", "Service Arbitrage", "$2,500+", "40%-60%")}
          ${renderCard(2, "s2", "Lead Routing", "$100-$300", "Faceless")}
          ${renderCard(3, "s3", "AI Content Engine", "$2k-$10k", "Passive")}
          ${renderCard(4, "s4", "Micro-SaaS Connector", "Monthly Recur.", "High Val.")}
          ${renderCard(5, "s5", "Niche Newsletter", "$50-$100 CPM", "Low Effort")}
          ${renderCard(6, "s6", "Domain Flipping", "$500-$5,000", "Speculative")}
          ${renderCard(7, "s7", "Digital Asset Sales", "$20-$150", "95% Margin")}
          ${renderCard(8, "s8", "YouTube Faceless", "Ad Revenue", "Automated")}
          ${renderCard(9, "s9", "Template Packs", "Subscription", "High Retention")}
          ${renderCard(10, "s10", "White-Label Software", "$99-$299/mo", "Scalable")}
        `;
      } else {
        content.innerHTML = `<div class="idea-card"><h3>Upgrade to Founder Access</h3><p>Unlock all 10 verified profit systems.</p></div>`;
      }
    });

    function renderCard(num, key, title, val, stat) {
      return `
        <div class="idea-card">
          <h3>${num}. ${title}</h3>
          <div class="formula-grid">
            <div class="formula-item">VALUE<span>${val}</span></div>
            <div class="formula-item">STATUS<span>${stat}</span></div>
          </div>
          <button class="btn-action" onclick="openStrategy('${key}')">Open Instructions</button>
        </div>`;
    }
  </script>
</body>
</html>
