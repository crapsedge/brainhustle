<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profit Vault | BrainHustle™</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-green: #00e676;
      --bg-black: #050505;
      --panel-bg: #0f0f0f;
      --border-color: #1e1e1e;
      --text-dim: #888;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-black);
      color: white;
      display: flex;
      min-height: 100vh;
    }

    /* NAVIGATION */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; width: 100%; height: 60px;
      background: #000; border-bottom: 1px solid var(--border-color);
      z-index: 1001; padding: 0 20px; align-items: center; justify-content: space-between;
    }

    .sidebar {
      width: 260px; background: #000; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000;
      transition: transform 0.3s ease;
    }

    .brand-box { padding: 30px 25px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--border-color); }
    .brand-box span { color: var(--primary-green); }

    .nav-group { padding: 20px 0; flex-grow: 1; }
    .nav-group a {
      display: flex; align-items: center; padding: 12px 25px;
      color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s;
    }
    .nav-group a:hover, .nav-group a.active { color: #fff; background: #0f0f0f; }
    .nav-group a.active { border-right: 3px solid var(--primary-green); color: #fff; }

    /* CONTENT AREA */
    main {
      flex-grow: 1;
      margin-left: 260px;
      padding: 40px 60px;
      max-width: 1200px;
    }

    .header-area { margin-bottom: 40px; }
    .header-area h1 { font-size: 26px; font-weight: 800; margin: 0; }
    .header-area p { color: var(--text-dim); margin-top: 4px; font-size: 14px; }

    /* IDEA CARDS */
    .vault-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    .idea-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 12px;
    }

    .idea-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; }
    .idea-header h2 { font-size: 20px; color: var(--primary-green); margin: 0; }
    .difficulty { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }

    .formula-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
      background: #000;
      padding: 15px;
      border-radius: 8px;
    }

    .formula-item span { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
    .formula-item div { font-size: 14px; font-weight: 700; color: #eee; }

    .btn-action {
      display: inline-block;
      padding: 12px 25px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      border-radius: 6px;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .btn-action:hover { background: var(--primary-green); color: #000; }

    .upgrade-lock {
      background: rgba(255, 62, 62, 0.05);
      border: 1px solid #ff3e3e;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      margin-top: 30px;
    }

    footer { margin-top: 60px; padding: 30px 0; border-top: 1px solid var(--border-color); font-size: 11px; color: #444; text-align: center; }

    @media (max-width: 900px) {
      .mobile-header { display: flex; }
      .sidebar { transform: translateX(-100%); width: 280px; }
      .sidebar.open { transform: translateX(0); }
      main { margin-left: 0; padding: 80px 20px 40px; }
      .formula-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="mobile-header">
    <div style="font-weight:800;">Brain<span>Hustle</span></div>
    <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:24px;">☰</button>
  </div>

  <nav class="sidebar" id="sidebar">
    <div class="brand-box">Brain<span>Hustle</span>™</div>
    <div class="nav-group">
      <a href="dashboard.html">Dashboard</a>
      <a href="kits.html">Hustle Kits</a>
      <a href="ideas.html" class="active">Money Ideas</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="trackers.html">Trackers</a>
    </div>
    <div style="padding: 20px; border-top: 1px solid var(--border-color);">
      <a href="#" onclick="logout()" style="color: #ff4444; font-size: 11px; font-weight:700; text-decoration:none;">LOGOUT</a>
    </div>
  </nav>

  <main id="mainContent">
    <div class="header-area">
      <h1>Profit Vault</h1>
      <p id="authStatus">Authenticating Secure Access...</p>
    </div>

    <div id="vaultContainer">
        </div>

    <footer>
      © 2026 MURRAYS EMPIRE LLC. Systems are for educational use. No income guarantees.
    </footer>
  </main>

  <script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.appspot.com",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const container = document.getElementById('vaultContainer');
    const authStatus = document.getElementById('authStatus');

    window.logout = function(){ signOut(auth).then(()=>{ window.location.href="login.html"; }); };

    function renderStarter() {
      container.innerHTML = `
        <div class="vault-grid">
          <div class="idea-card">
            <div class="idea-header">
              <h2>1. Local Referral Networks</h2>
              <span class="difficulty">Low Effort • Fast Results</span>
            </div>
            <p>Connect local homeowners in urgent need (Water Damage/HVAC) with vetted independent contractors. You act as the bridge.</p>
            <div class="formula-box">
              <div class="formula-item"><span>Average Fee</span><div>$150 - $500</div></div>
              <div class="formula-item"><span>Up-Front Cost</span><div>$10 / Day</div></div>
              <div class="formula-item"><span>Time to Start</span><div>< 48 Hours</div></div>
            </div>
            <a class="btn-action" href="kits.html">Review Referral Kit</a>
          </div>
        </div>
        <div class="upgrade-lock">
          <h3 style="color:#ff3e3e; font-size:16px;">UPGRADE TO FOUNDER TIER</h3>
          <p style="font-size:13px; color:#888;">Unlock the full 2026 Profit Vault including Digital Arbitrage, AI SaaS building, and Private Lead Funnels.</p>
          <a href="upgrade.html" style="color:#fff; font-weight:800; text-decoration:none; display:inline-block; margin-top:15px; border-bottom:1px solid #ff3e3e;">Upgrade Now →</a>
        </div>
      `;
    }

    function renderUpgraded() {
      container.innerHTML = `
        <div class="vault-grid">
          <div class="idea-card">
            <div class="idea-header"><h2>1. Local Referral Networks</h2><span class="difficulty">Direct Response</span></div>
            <p>Route urgent leads to high-ticket contractors. The "Omaha Restoration" model.</p>
            <div class="formula-box">
              <div class="formula-item"><span>Fee Structure</span><div>$150 + 10%</div></div>
              <div class="formula-item"><span>Scalability</span><div>Unlimited</div></div>
              <div class="formula-item"><span>Tech Needs</span><div>Minimal</div></div>
            </div>
            <a class="btn-action" href="kits.html">Deploy Kit</a>
          </div>

          <div class="idea-card">
            <div class="idea-header"><h2>2. Digital Arbitrage</h2><span class="difficulty">Medium Effort</span></div>
            <p>Buy underpriced digital services and resell them to corporate clients as high-end packages.</p>
            <div class="formula-box">
              <div class="formula-item"><span>Profit Margin</span><div>60% - 80%</div></div>
              <div class="formula-item"><span>Client Value</span><div>$1,500+</div></div>
              <div class="formula-item"><span>Risk Level</span><div>Low</div></div>
            </div>
            <a class="btn-action" href="#">Unlock Strategy</a>
          </div>

          <div class="idea-card">
            <div class="idea-header"><h2>3. AI Content Engines</h2><span class="difficulty">High Automation</span></div>
            <p>Build content properties that run on 100% AI generation, monetized via affiliate networks.</p>
            <div class="formula-box">
              <div class="formula-item"><span>Income Type</span><div>Passive</div></div>
              <div class="formula-item"><span>Time to First $</span><div>30-60 Days</div></div>
              <div class="formula-item"><span>Manual Labor</span><div>< 1hr / Day</div></div>
            </div>
            <a class="btn-action" href="#">Review Blueprints</a>
          </div>
        </div>
      `;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      
      const snap = await getDoc(doc(db, "users", user.uid));
      const level = snap.exists() ? (snap.data().membership || "starter") : "starter";

      if (level === "upgraded") {
        authStatus.textContent = "Founder Tier Access Verified ✅";
        authStatus.style.color = "var(--primary-green)";
        renderUpgraded();
      } else {
        authStatus.textContent = "Starter Access: Upgrades Available Below";
        renderStarter();
      }
    });
  </script>
</body>
</html>
