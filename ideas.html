    const STRATEGIES = {

        <p style="margin-bottom:20px;"><strong>Step 3:</strong> Build a clean, high-end "Agency" landing page using the AI Tools in your dashboard.</p>
        <p style="margin-bottom:20px;"><strong>Step 4:</strong> Launch LinkedIn outreach or Google Ads targeting small-to-medium businesses. You sell the service for $2,000, buy it for $500, and keep the difference.</p>

      content: `

        </div>
      `;
    }

    // ... (Keep the rest of your Firebase onAuthStateChanged logic) ...
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      const level = snap.exists() ? (snap.data().membership || "starter") : "starter";
      if (level === "upgraded") { renderUpgraded(); } else { /* call renderStarter */ }
    });
</script>
