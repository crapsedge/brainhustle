<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profit Vault | BrainHustle™</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-green: #00e676;
      --bg-black: #050505;
      --panel-bg: #0f0f0f;
      --border-color: #1e1e1e;
      --text-dim: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-black);
      color: white;
      display: flex;
      min-height: 100vh;
    }

    /* NAVIGATION */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; width: 100%; height: 60px;
      background: #000; border-bottom: 1px solid var(--border-color);
      z-index: 1001; padding: 0 20px; align-items: center; justify-content: space-between;
    }

    .sidebar {
      width: 260px; background: #000; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000;
      transition: transform 0.3s ease;
    }

    .brand-box { padding: 30px 25px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--border-color); }
    .brand-box span { color: var(--primary-green); }

    .nav-group { padding: 20px 0; flex-grow: 1; }
    .nav-group a {
      display: flex; align-items: center; padding: 12px 25px;
      color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s;
    }
    .nav-group a:hover, .nav-group a.active { color: #fff; background: #0f0f0f; }
    .nav-group a.active { border-right: 3px solid var(--primary-green); color: #fff; }

    /* MAIN CONTENT */
    main {
      flex-grow: 1;
      margin-left: 260px;
      padding: 40px 60px;
      max-width: 900px;
    }

    .header-area { margin-bottom: 40px; }
    .header-area h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -1px; }
    .header-area p { color: var(--text-dim); margin-top: 4px; font-size: 14px; }

    /* IDEA CARDS */
    .idea-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .idea-box h3 { font-size: 18px; color: var(--primary-green); margin-bottom: 10px; font-weight: 800; }
    .idea-box p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }

    .formula-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      background: #000;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .formula-item { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .formula-item span { display: block; color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px; }

    .btn-link {
      display: inline-block;
      color: var(--primary-green);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upgrade-lock {
      background: rgba(255, 62, 62, 0.05);
      border: 1px solid #ff3e3e;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      margin-top: 30px;
    }

    footer { margin-top: 60px; padding: 30px 0; border-top: 1px solid var(--border-color); font-size: 11px; color: #444; text-align: center; }

    @media (max-width: 900px) {
      .mobile-header { display: flex; }
      .sidebar { transform: translateX(-100%); width: 280px; }
      .sidebar.open { transform: translateX(0); }
      main { margin-left: 0; padding: 80px 20px 40px; }
    }
  </style>
</head>
<body>

  <div class="mobile-header">

  </div>

  <nav class="sidebar" id="sidebar">

    <div class="nav-group">

    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.appspot.com",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"

    const app = initializeApp(firebaseConfig);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      
      const snap = await getDoc(doc(db, "users", user.uid));
      const level = snap.exists() ? (snap.data().membership || "starter") : "starter";

      if (level === "upgraded") {
        authStatus.textContent = "Founder Tier Status: Verified ✅";
        authStatus.style.color = "var(--primary-green)";
        renderUpgraded();
      } else {

</body>
</html>
