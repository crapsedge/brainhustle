<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – BrainHustle™</title>

  <style>
    body {
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #00cc66;
    }

    input {
      padding: 12px;
      margin: 10px 0;
      width: 80%;
      max-width: 320px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      padding: 12px 24px;
      background: #00cc66;
      border: none;
      color: black;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      background: #00e676;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a {
      color: #00cc66;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .note {
      color: #aaa;
      font-size: 14px;
      max-width: 420px;
      margin: 18px auto;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>Create Your BrainHustle™ Account</h1>

  <input type="email" id="email" placeholder="Email" autocomplete="email" /><br>
  <input type="password" id="password" placeholder="Password" autocomplete="new-password" /><br>

  <button id="signupBtn">Sign Up</button>

  <p class="note">
    After signing up, check your email and click the verification link before logging in.
  </p>

  <p>Already have an account? <a href="login.html">Login</a></p>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1cS4bIOxNAQuDFsyRq6mGzz9xeKqKFiY",
      authDomain: "brainhustle-92a40.firebaseapp.com",
      projectId: "brainhustle-92a40",
      storageBucket: "brainhustle-92a40.firebasestorage.app",
      messagingSenderId: "547592914180",
      appId: "1:547592914180:web:be4969f6a657c2b6c9bc51",
      measurementId: "G-3M5PKR5S27"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function notifyOwner(email, status) {
      const formData = new FormData();

      formData.append("access_key", "cbd2d323-5aae-4acd-befe-929a51034d58");
      formData.append("subject", "New BrainHustle Signup Activity");
      formData.append("from_name", "BrainHustle Signup Form");

      formData.append("Business", "BrainHustle");
      formData.append("Submitted_Email", email);
      formData.append("Status", status);
      formData.append("Time", new Date().toLocaleString());
      formData.append("Page", "signup.html");

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          console.log("Owner notification sent.");
        } else {
          console.log("Web3Forms error:", result);
        }

      } catch (error) {
        console.log("Owner notification failed:", error);
      }
    }

    document.getElementById("signupBtn").addEventListener("click", async function() {
      const signupBtn = document.getElementById("signupBtn");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter your email and password.");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "Creating Account...";

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await user.sendEmailVerification();

        await notifyOwner(email, "SUCCESS: Account created and verification email sent.");

        alert("Signup successful. A verification link has been sent to your email. Please check your inbox and spam folder before logging in.");

        window.location.href = "login.html";

      } catch (error) {
        await notifyOwner(email, "FAILED SIGNUP ATTEMPT: " + error.message);

        if (error.code === "auth/email-already-in-use") {
          alert("This email already has an account. Please login or use Forgot Password.");
        } else {
          alert("Signup failed: " + error.message);
        }

        signupBtn.disabled = false;
        signupBtn.textContent = "Sign Up";
      }
    });
  </script>

</body>
</html>
